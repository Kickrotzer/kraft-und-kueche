<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B6B53">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kraft und Küche">
<style>:root{color-scheme:light dark;padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Kraft und Küche</title>
<style>
/* Layout: eine Spalte wie eine Handy-App, vier Tabs unten, Karten nur für Dinge, die man bedient */
:root{
  --bg:#EEF2F0; --card:#FFFFFF; --ink:#13201B; --mute:#5E6F68; --line:#D3DCD8;
  --accent:#1B6B53; --accent-ink:#FFFFFF; --soft:#DCEBE5; --warm:#C4512F; --warm-soft:#F6E1D9;
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1613; --card:#17211D; --ink:#E7EFEB; --mute:#93A59D; --line:#2A3833;
  --accent:#4FB594; --accent-ink:#0E1613; --soft:#1F3029; --warm:#EE8A67; --warm-soft:#38231C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1613; --card:#17211D; --ink:#E7EFEB; --mute:#93A59D; --line:#2A3833;
  --accent:#4FB594; --accent-ink:#0E1613; --soft:#1F3029; --warm:#EE8A67; --warm-soft:#38231C; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px 96px}
h1{font-size:28px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:13px;margin:0 0 10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
h3{font-size:17px;margin:0;font-weight:700}
.sub{color:var(--mute);font-size:14px;margin:4px 0 0}
section{margin-top:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.num{font-variant-numeric:tabular-nums}
.big{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1}
.unit{font-size:16px;color:var(--mute);font-weight:500;letter-spacing:0}
.bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .25s}
.bar.warm>i{background:var(--warm)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 13px;min-height:44px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button.sm{min-height:38px;padding:6px 11px;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border-radius:999px;padding:7px 14px;min-height:38px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill{display:inline-block;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;background:var(--soft);color:var(--accent)}
.pill.warm{background:var(--warm-soft);color:var(--warm)}
.ex{padding-block:14px;border-top:1px solid var(--line)}
.ex:first-child{border-top:0;padding-top:0}
.sets{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.set{width:48px;height:48px;border-radius:12px;padding:0;font-weight:700;font-size:15px;color:var(--mute)}
.set[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
input[type=number]{width:84px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;min-height:44px;text-align:right;font-variant-numeric:tabular-nums}
.meta{color:var(--mute);font-size:14px}
.chk{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;min-height:44px}
.chk:first-of-type{border-top:0}
.chk input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.chk.done span{color:var(--mute);text-decoration:line-through}
.meal{padding-block:14px;border-top:1px solid var(--line)}
.meal:first-of-type{border-top:0;padding-top:0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav .in{display:flex;width:100%;max-width:560px;gap:4px}
nav button{flex:1;min-width:0;border:0;background:none;border-radius:10px;color:var(--mute);font-size:13px;font-weight:600;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--accent);background:var(--soft)}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl td{padding:8px 0;border-top:1px solid var(--line)}
.tbl td:last-child{text-align:right}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--mute);font-size:11px;font-family:var(--font)}
.note{font-size:13px;color:var(--mute);margin-top:12px}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<nav><div class="in" id="nav"></div></nav>

<script>
(function(){
var TARGET_P=160, TARGET_W=2.5, TARGET_KCAL=2300;
var DAYN=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
var MON=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

var PLAN={
 1:{id:"mo",name:"Oberkörper und Haltung",where:"Zuhause",ex:[
  ["Einarmiges Kurzhantelrudern",3,"8 bis 12"],["Schulterdrücken",3,"8 bis 12"],["Liegestütze",3,"8 bis 12"],
  ["Rudern vorgebeugt mit Band",3,"8 bis 12"],["Bizeps Curls",3,"8 bis 12"],["Y/T/W Raises",2,"10"],
  ["Band Face Pulls",2,"12"],["Dead Bugs",2,"10 pro Seite"]]},
 3:{id:"mi",name:"Beine und Rücken",where:"Gym",ex:[
  ["Kniebeuge",3,"8 bis 10"],["Rumänisches Kreuzheben",3,"8 bis 10"],["Latzug oder Klimmzüge",3,"8 bis 10"],
  ["Rudern am Kabel",3,"8 bis 10"],["Face Pulls",3,"12 bis 15"],["Hip Thrust",3,"8 bis 10"]]},
 6:{id:"sa",name:"Ganzkörper",where:"Zuhause",ex:[
  ["Bulgarian Split Squats",3,"8 bis 10 pro Seite"],["Glute Bridges",3,"12 bis 15"],["Liegestütze mit erhöhten Füßen",3,"8 bis 12"],
  ["Rudern mit Kurzhanteln",3,"8 bis 12"],["Schulterdrücken",3,"8 bis 12"],["Plank",3,"40 Sek"],["Seitstütz",3,"30 Sek pro Seite"]]}
};
var MOB={id:"mob",name:"Mobility, 10 Minuten",where:"Studiotag, optional",ex:[
  ["Band Pull-Aparts",2,"10"],["Wall Angels",2,"10"],["Glute Bridges",2,"10"],["Plank",2,"30 Sek"],["Brustdehnung im Türrahmen",2,"1 Min"]]};
function planFor(dow){ if(PLAN[dow])return PLAN[dow]; if(dow===4||dow===5)return MOB; return null; }

var DISHES=[
 ["Linsen-Chili","Rote Linsen, Dosentomaten, Kidneybohnen, Zwiebel, Knoblauch, Paprika, Kreuzkümmel, Reis",30,"1,20 €"],
 ["Kichererbsen-Curry","Kichererbsen, Spinat, Kokosmilch light, Kurkuma, Ingwer, Curry, Reis",25,"1,50 €"],
 ["Ofenkartoffeln mit Kräuterquark","Kartoffeln, Magerquark, Leinöl, Schnittlauch, TK-Brokkoli, Thunfisch",45,"1,80 €"],
 ["Hering-Bowl","Matjes oder Makrele aus der Dose, Kartoffeln, Gurke, Zwiebel, Magerquark, Leinöl",40,"2,20 €"],
 ["Tofu-Gemüse-Pfanne","Tofu, TK-Gemüse, Ingwer, Knoblauch, Kurkuma, Reis, Sesam",35,"1,60 €"],
 ["Protein-Haferbrei","Haferflocken, Magerquark, TK-Beeren, Leinsamen, Walnüsse, Zimt",40,"1,00 €"]
];
var SHOP=[
 ["Eiweiß",["1 kg Magerquark","2 Becher Skyr","400 g Hüttenkäse","20 Eier","1 kg Hähnchenbrust","2 Dosen Thunfisch","2 Blöcke Tofu"]],
 ["Hülsenfrüchte",["500 g Linsen","500 g Kichererbsen","2 Dosen Kidneybohnen"]],
 ["Kohlenhydrate",["500 g Haferflocken","1 kg Reis","3 kg Kartoffeln","500 g Vollkornnudeln"]],
 ["Gemüse und Obst",["1 kg TK-Gemüse","Karotten und Zwiebeln","Dosentomaten","7 Bananen","4 bis 5 Äpfel"]],
 ["Entzündungshemmend",["Hering oder Makrele aus der Dose","TK-Lachs","Olivenöl und Leinöl","Leinsamen und Walnüsse","TK-Beeren","TK-Spinat und Brokkoli","Kurkuma, Ingwer, Knoblauch"]],
 ["Sonstiges",["Rapsöl","200 g Nüsse","Paprika, Kreuzkümmel, Curry, Zimt"]]
];
var FASTMEALS=[["12:00","Große Mittagsbowl","ca. 55 g Protein"],["15:30","Quark oder Skyr mit Beeren und Nüssen","ca. 40 g Protein"],["19:30","Abendessen","ca. 55 g Protein"]];
var FOURMEALS=[["Morgens","Haferbrei mit Quark und Banane","ca. 40 g Protein"],["Mittags","Linsen oder Kichererbsen mit Reis und 2 Eiern","ca. 45 g Protein"],["Snack","Hüttenkäse oder Skyr mit Obst und Nüssen","ca. 30 g Protein"],["Abends","Kartoffeln mit Quark, Gemüse und Hähnchen oder Tofu","ca. 45 g Protein"]];

var S={days:{},weights:[],shop:{},kg:{},fast:true};
var tab="heute", planDay=null, uid=null, dbDoc=null, saveT=null, saving=false, dirty=false;

function key(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function today(){var k=key();if(!S.days[k])S.days[k]={p:0,w:0,sets:{}};return S.days[k];}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]});}
function fmt(n){return String(Math.round(n*100)/100).replace(".",",");}

/* Speichern: db (privat pro Person), sonst Browser */
function load(cb){
  var local=null;
  try{local=JSON.parse(localStorage.getItem("kk-state")||"null");}catch(e){}
  Promise.resolve().then(function(){
    return window.claude&&window.claude.use?Promise.all([window.claude.use("db"),window.claude.use("user")]):[null,null];
  }).then(function(r){
    var db=r[0],user=r[1];
    if(!db||!user)return null;
    return user.id().then(function(id){
      if(!id)return null;
      uid=id; dbDoc=db.doc("data/users/"+id+"/app");
      return dbDoc.get().then(function(s){return s.exists?s.data():null;});
    });
  }).catch(function(){return null;}).then(function(remote){
    var src=remote||local;
    if(src&&src.days){S=Object.assign(S,src);}
    cb();
  });
}
function save(){
  dirty=true;
  try{localStorage.setItem("kk-state",JSON.stringify(S));}catch(e){}
  clearTimeout(saveT);
  saveT=setTimeout(flush,1200);
}
function flush(){
  if(!dbDoc||saving||!dirty)return;
  saving=true;dirty=false;
  var snap=JSON.parse(JSON.stringify(S));
  dbDoc.set(snap).catch(function(){}).then(function(){saving=false;if(dirty)saveT=setTimeout(flush,1200);});
}

/* Fastenfenster */
function fastInfo(){
  var n=new Date(),m=n.getHours()*60+n.getMinutes(),o=12*60,c=20*60;
  if(m>=o&&m<c){var r=c-m;return{open:true,t:"Essfenster offen, noch "+Math.floor(r/60)+" Std "+String(r%60).padStart(2,"0")+" Min bis 20:00"};}
  var next=m<o?o-m:(24*60-m)+o;
  return{open:false,t:"Fasten, Essfenster öffnet um 12:00 in "+Math.floor(next/60)+" Std "+String(next%60).padStart(2,"0")+" Min"};
}

var ICONS={
 heute:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg>',
 training:'<svg viewBox="0 0 24 24"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>',
 essen:'<svg viewBox="0 0 24 24"><path d="M5 11h14a7 7 0 0 1-7 7 7 7 0 0 1-7-7zM9 4c0 2 2 2 2 4M14 4c0 2 2 2 2 4"/></svg>',
 einkauf:'<svg viewBox="0 0 24 24"><path d="M4 5h2l2 10h9l2-7H7"/><circle cx="9" cy="19" r="1"/><circle cx="17" cy="19" r="1"/></svg>',
 verlauf:'<svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-9"/><path d="M4 20h16"/></svg>'
};
var TABS=[["heute","Heute"],["training","Training"],["essen","Essen"],["einkauf","Einkauf"],["verlauf","Verlauf"]];
function drawNav(){
  document.getElementById("nav").innerHTML=TABS.map(function(t){
    return '<button data-tab="'+t[0]+'"'+(tab===t[0]?' aria-current="page"':'')+'>'+ICONS[t[0]]+t[1]+'</button>';}).join("");
}

function head(title,sub){return '<h1>'+title+'</h1><p class="sub">'+sub+'</p>';}

/* Heute */
function vHeute(){
  var n=new Date(),d=today(),dow=n.getDay(),pl=planFor(dow),fi=fastInfo();
  var pp=Math.min(100,d.p/TARGET_P*100),ww=Math.min(100,d.w/TARGET_W*100);
  var h=head(DAYN[dow],n.getDate()+". "+MON[n.getMonth()]+" "+n.getFullYear());
  h+='<section><div class="card"><div class="row"><h2 class="grow" style="margin:0">Protein</h2><span class="pill'+(d.p>=TARGET_P?'':' warm')+'">'+(d.p>=TARGET_P?"Ziel erreicht":"noch "+(TARGET_P-d.p)+" g")+'</span></div>'+
   '<div class="big num" style="margin-top:10px">'+d.p+'<span class="unit"> von '+TARGET_P+' g</span></div>'+
   '<div class="bar warm"><i style="width:'+pp+'%"></i></div>'+
   '<div class="chips" style="margin-top:14px">'+[10,20,30,40].map(function(v){return '<button class="chip" data-p="'+v+'">+'+v+' g</button>';}).join("")+'<button class="chip" data-p="-10" aria-label="10 g abziehen">-10</button></div>'+
   '<p class="note">Tagesziel ca. '+TARGET_KCAL+' kcal. Das Gericht aus dem Tab Essen trägt sein Protein direkt ein.</p></div></section>';
  h+='<section><div class="card"><div class="row"><h2 class="grow" style="margin:0">Wasser</h2><span class="meta num">Ziel '+fmt(TARGET_W)+' l</span></div>'+
   '<div class="big num" style="margin-top:10px">'+fmt(d.w)+'<span class="unit"> l</span></div><div class="bar"><i style="width:'+ww+'%"></i></div>'+
   '<div class="chips" style="margin-top:14px"><button class="chip" data-w="0.25">+0,25 l</button><button class="chip" data-w="0.5">+0,5 l</button><button class="chip" data-w="-0.25" aria-label="0,25 Liter abziehen">-0,25</button></div></div></section>';
  var done=0,tot=0;
  if(pl){pl.ex.forEach(function(e,i){tot+=e[1];for(var s=0;s<e[1];s++)if(d.sets[pl.id+i+"_"+s])done++;});}
  h+='<section><h2>Training heute</h2><div class="card">'+(pl?
    '<div class="row"><div class="grow"><h3>'+pl.name+'</h3><div class="meta">'+pl.where+'</div></div><span class="pill'+(done===tot?'':' warm')+' num">'+done+'/'+tot+' Sätze</span></div>'+
    '<div class="row" style="margin-top:12px"><button class="pri" data-go="training">Training öffnen</button></div>':
    '<h3>Frei</h3><div class="meta">Spaziergang, Ziel 8.000 Schritte.</div>')+'</div></section>';
  h+='<section><h2>Essen heute</h2><div class="card">'+
    '<div class="row"><div class="grow"><h3>Intervallfasten 16:8</h3><div class="meta" id="fastline">'+(S.fast?fi.t:"Aus, normale Mahlzeiten")+'</div></div>'+
    '<button class="sm" data-fast="1" aria-pressed="'+S.fast+'">'+(S.fast?"Ausschalten":"Einschalten")+'</button></div><div style="margin-top:10px">'+
    (S.fast?FASTMEALS:FOURMEALS).map(function(m){return '<div class="meal"><div class="row"><b class="num" style="min-width:64px">'+m[0]+'</b><div class="grow">'+m[1]+'<div class="meta">'+m[2]+'</div></div></div></div>';}).join("")+
    '</div></div></section>';
  return h;
}

/* Training */
function vTraining(){
  var n=new Date(),dow=n.getDay();
  var opts=[[1,"Mo"],[3,"Mi"],[6,"Sa"],[4,"Mobility"]];
  if(planDay===null)planDay=planFor(dow)?(PLAN[dow]?dow:4):1;
  var pl=planDay===4?MOB:PLAN[planDay],d=today();
  var h=head("Training","Gewicht oder Wiederholungen steigern, sobald die obere Zahl sauber klappt.");
  h+='<section><div class="chips">'+opts.map(function(o){return '<button class="chip" data-pd="'+o[0]+'" aria-pressed="'+(planDay===o[0])+'">'+o[1]+'</button>';}).join("")+'</div></section>';
  h+='<section><div class="card"><div class="row" style="margin-bottom:14px"><div class="grow"><h3>'+pl.name+'</h3><div class="meta">'+pl.where+'</div></div></div>';
  pl.ex.forEach(function(e,i){
    var id=pl.id+i,kg=S.kg[id];
    var sets="";for(var s=0;s<e[1];s++){var on=!!d.sets[id+"_"+s];sets+='<button class="set num" data-set="'+id+"_"+s+'" aria-pressed="'+on+'" aria-label="Satz '+(s+1)+'">'+(s+1)+'</button>';}
    h+='<div class="ex"><div class="row wrap"><div class="grow"><b>'+esc(e[0])+'</b><div class="meta">'+e[1]+' Sätze, '+esc(e[2])+' Wdh.</div></div>'+
       (pl.id==="mob"?'':'<label class="row meta" style="gap:6px"><input type="number" inputmode="decimal" step="0.5" min="0" data-kg="'+id+'" value="'+(kg==null?"":kg)+'" placeholder="kg" aria-label="Gewicht in Kilogramm für '+esc(e[0])+'"><span>kg</span></label>')+
       '</div><div class="sets">'+sets+'</div></div>';
  });
  h+='</div></section>';
  h+='<section><h2>Haltung</h2><div class="card"><div class="meta" style="font-size:15px;color:var(--ink)">Doppelt so viele Zug- wie Druckübungen. Täglich 2 Min Brustdehnung im Türrahmen und 10 Wall Angels. Im Studio einmal pro Stunde aufstehen und die Schulterblätter zusammenziehen.</div></div></section>';
  return h;
}

/* Essen */
function vEssen(){
  var h=head("Essen","Günstig, proteinreich, entzündungshemmend.");
  h+='<section><h2>Gerichte</h2><div class="stack">'+DISHES.map(function(g,i){
    return '<div class="card"><div class="row"><h3 class="grow">'+esc(g[0])+'</h3><span class="pill num">'+g[2]+' g</span></div>'+
     '<p class="meta" style="margin:6px 0 12px">'+esc(g[1])+'</p><div class="row"><span class="meta num grow">ca. '+g[3]+' pro Portion</span><button class="sm pri" data-dish="'+i+'">Protein eintragen</button></div></div>';}).join("")+'</div></section>';
  return h;
}

/* Einkauf */
function vEinkauf(){
  var h=head("Einkauf","Eine Woche, ca. 40 bis 50 € beim Discounter.");
  h+='<section><h2>Liste</h2><div class="card">'+SHOP.map(function(grp,gi){
    return '<div style="'+(gi?'margin-top:16px':'')+'"><b>'+grp[0]+'</b>'+grp[1].map(function(it,ii){
      var k=gi+"_"+ii,on=!!S.shop[k];
      return '<label class="chk'+(on?' done':'')+'"><input type="checkbox" data-shop="'+k+'"'+(on?' checked':'')+'><span>'+esc(it)+'</span></label>';}).join("")+'</div>';}).join("")+
    '<div class="row" style="margin-top:16px"><button class="sm" data-shopreset="1">Liste zurücksetzen</button></div><p class="note">Etwa 40 bis 50 € pro Woche beim Discounter, plus 5 bis 8 € für die entzündungshemmenden Teile.</p></div></section>';
  return h;
}

/* Verlauf */
function chart(){
  var w=S.weights.slice(-30);
  if(w.length<2)return '<p class="meta" style="margin:8px 0 0">Ab zwei Einträgen erscheint hier der Verlauf.</p>';
  var W=520,H=190,pl=36,pr=12,pt=14,pb=26;
  var vals=w.map(function(x){return x[1];}),mn=Math.floor(Math.min.apply(null,vals)-1),mx=Math.ceil(Math.max.apply(null,vals)+1);
  function X(i){return pl+(W-pl-pr)*i/(w.length-1);}
  function Y(v){return pt+(H-pt-pb)*(1-(v-mn)/(mx-mn));}
  var ticks=[mn,(mn+mx)/2,mx],g="";
  ticks.forEach(function(t){g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(t)+'" y2="'+Y(t)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(pl-6)+'" y="'+(Y(t)+4)+'" text-anchor="end">'+fmt(t)+'</text>';});
  var pts=w.map(function(x,i){return X(i)+","+Y(x[1]);}).join(" ");
  var last=w[w.length-1],li=w.length-1;
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gewichtsverlauf der letzten '+w.length+' Einträge">'+g+
   '<polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
   '<circle cx="'+X(li)+'" cy="'+Y(last[1])+'" r="5" fill="var(--accent)"/>'+
   '<text x="'+X(li)+'" y="'+(Y(last[1])-10)+'" text-anchor="end" style="fill:var(--ink);font-weight:700;font-size:12px">'+fmt(last[1])+' kg</text>'+
   '<text x="'+pl+'" y="'+(H-6)+'">'+w[0][0].slice(5).split("-").reverse().join(".")+'.</text>'+
   '<text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end">'+last[0].slice(5).split("-").reverse().join(".")+'.</text></svg>';
}
function weekTrainings(){
  var n=new Date(),c=0;
  for(var i=0;i<7;i++){var d=new Date(n);d.setDate(n.getDate()-i);var rec=S.days[key(d)];
    if(rec){var ok=false;for(var k in rec.sets){if(rec.sets[k]&&k.indexOf("mob")!==0){ok=true;break;}}if(ok)c++;}}
  return c;
}
function vVerlauf(){
  var w=S.weights,last=w.length?w[w.length-1]:null;
  var avg7=null;if(w.length){var sl=w.slice(-7);avg7=sl.reduce(function(a,x){return a+x[1];},0)/sl.length;}
  var h=head("Verlauf","Wiege dich 2 bis 3 mal pro Woche morgens, wichtig ist der Durchschnitt.");
  h+='<section><div class="card"><h2>Gewicht eintragen</h2><div class="row"><input type="number" id="wIn" inputmode="decimal" step="0.1" min="30" max="250" placeholder="kg" aria-label="Körpergewicht in Kilogramm" style="width:110px" value="'+(last?last[1]:"")+'"><button class="pri" id="wAdd">Speichern</button></div>'+
   '<div class="row" style="margin-top:16px;gap:24px"><div><div class="meta">Letzter Wert</div><div class="big num" style="font-size:28px">'+(last?fmt(last[1]):"offen")+'<span class="unit"> kg</span></div></div>'+
   '<div><div class="meta">Schnitt der letzten 7</div><div class="big num" style="font-size:28px">'+(avg7?fmt(avg7):"offen")+'<span class="unit"> kg</span></div></div></div></div></section>';
  h+='<section><h2>Entwicklung</h2><div class="card">'+chart()+'</div></section>';
  h+='<section><h2>Diese Woche</h2><div class="card"><div class="row"><h3 class="grow">Kraft-Einheiten</h3><span class="pill num">'+weekTrainings()+' von 3</span></div></div></section>';
  h+='<section><h2>Anpassen nach 2 bis 3 Wochen</h2><div class="card"><table class="tbl"><tr><td>Keine Abnahme</td><td>2.200 kcal</td></tr><tr><td>Mehr als 0,5 kg pro Woche</td><td>2.450 kcal</td></tr><tr><td>Kraft steigt, Gewicht sinkt langsam</td><td>nichts ändern</td></tr></table></div></section>';
  if(w.length){h+='<section><h2>Einträge</h2><div class="card"><table class="tbl num">'+w.slice(-8).reverse().map(function(x){return '<tr><td>'+x[0].split("-").reverse().join(".")+'</td><td>'+fmt(x[1])+' kg</td></tr>';}).join("")+'</table></div></section>';}
  return h;
}

function render(){
  var y=window.scrollY;
  var v={heute:vHeute,training:vTraining,essen:vEssen,einkauf:vEinkauf,verlauf:vVerlauf}[tab]();
  document.getElementById("app").innerHTML=v;
  drawNav();
  window.scrollTo(0,y);
}

document.addEventListener("click",function(e){
  var t=e.target.closest("button,[data-shop]");if(!t)return;
  var d=today();
  if(t.dataset.tab){tab=t.dataset.tab;window.scrollTo(0,0);render();return;}
  if(t.dataset.go){tab=t.dataset.go;window.scrollTo(0,0);render();return;}
  if(t.dataset.p){d.p=Math.max(0,d.p+parseInt(t.dataset.p,10));save();render();return;}
  if(t.dataset.w){d.w=Math.max(0,Math.round((d.w+parseFloat(t.dataset.w))*100)/100);save();render();return;}
  if(t.dataset.fast){S.fast=!S.fast;save();render();return;}
  if(t.dataset.pd){planDay=parseInt(t.dataset.pd,10);render();return;}
  if(t.dataset.set){d.sets[t.dataset.set]=!d.sets[t.dataset.set];save();render();return;}
  if(t.dataset.dish){d.p+=DISHES[parseInt(t.dataset.dish,10)][2];save();t.textContent="Eingetragen";t.disabled=true;return;}
  if(t.dataset.shopreset){S.shop={};save();render();return;}
  if(t.id==="wAdd"){
    var v=parseFloat(String(document.getElementById("wIn").value).replace(",","."));
    if(!(v>=30&&v<=250))return;
    var k=key(),found=false;
    S.weights.forEach(function(x){if(x[0]===k){x[1]=v;found=true;}});
    if(!found)S.weights.push([k,v]);
    S.weights.sort(function(a,b){return a[0]<b[0]?-1:1;});
    save();render();return;
  }
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.shop){S.shop[t.dataset.shop]=t.checked;save();render();}
  else if(t.dataset&&t.dataset.kg){var v=parseFloat(String(t.value).replace(",","."));if(v>=0){S.kg[t.dataset.kg]=v;}else{delete S.kg[t.dataset.kg];}save();}
});
setInterval(function(){var el=document.getElementById("fastline");if(el&&S.fast)el.textContent=fastInfo().t;},30000);
document.addEventListener("visibilitychange",function(){if(document.hidden)flush();});

render();
load(render);
})();
</script>
